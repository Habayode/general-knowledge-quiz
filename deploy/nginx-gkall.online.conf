# Drop-in server block for the recon droplet's nginx container.
# Path on droplet: /root/recon-hagai-online/nginx/conf.d/gkall.online.conf
# (or wherever the existing subdomain vhosts live — check with:
#    docker exec recon-hagai-online-nginx-1 ls /etc/nginx/conf.d )

# --- HTTP: redirect to HTTPS + serve Let's Encrypt ACME challenge -----------
server {
    listen 80;
    listen [::]:80;
    server_name gkall.online www.gkall.online;

    # Let certbot answer HTTP-01 challenges over :80
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://gkall.online$request_uri;
    }
}

# --- HTTPS: main vhost, reverse-proxies to the gkall container --------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gkall.online;

    ssl_certificate     /etc/letsencrypt/live/gkall.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gkall.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security-adjacent headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(),camera=(),microphone=()" always;

    client_max_body_size 8m;

    location / {
        proxy_pass         http://gkall:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# --- HTTPS: www -> apex redirect --------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.gkall.online;

    ssl_certificate     /etc/letsencrypt/live/gkall.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gkall.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://gkall.online$request_uri;
}
