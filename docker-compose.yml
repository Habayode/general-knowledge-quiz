services:
  gkall:
    build: .
    image: gkall:portfolio
    container_name: gkall
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      PORTFOLIO_MODE: "1"
      PRIZE_USDT: "0"
      MONTHLY_PRIZES: "0,0,0"
      TG_BOT_TOKEN: ""
      TG_CHANNEL: ""
      TURNSTILE_SITE_KEY: ""
      TURNSTILE_SECRET: ""
      ADMIN_TOKEN: "${ADMIN_TOKEN:-portfolio-mode-no-admin-needed}"
      SOCIAL_TWITTER: "https://x.com/gkallonline"
    # No host port — the recon nginx container reaches us over the reconnet
    # network by container name (http://gkall:8080).
    networks:
      - reconnet

networks:
  reconnet:
    external: true
    name: recon-hagai-online_reconnet
